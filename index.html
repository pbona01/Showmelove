<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Showmelove — Send Animated Gifts with Real Value</title>
    <meta
      name="description"
      content="Send animated 3D digital gifts with personal voice notes, Digital Promise Cards, and real cash value through a shareable link."
    />
    <meta property="og:title" content="Showmelove — Send Animated Gifts with Real Value" />
    <meta
      property="og:description"
      content="Send animated 3D digital gifts with personal voice notes, Digital Promise Cards, and real cash value through a shareable link."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var key = 'showmelove_theme_preference_v1';
          var pref = window.localStorage.getItem(key) || 'dark';
          var isDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.dataset.themePref = pref;
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[var(--bg-page)] text-[var(--text-primary)] antialiased selection:bg-[#FF176C]/25 selection:text-[var(--text-primary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
